
name: Validacao do PortfolioHUB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-site:
    name: Verificar arquivos do site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar HTML e CSS
        run: |
          test -s index.html
          test -s style.css
          grep -qi '<html' index.html
          grep -qi '</html>' index.html
          grep -q 'style.css' index.html
          echo "Arquivos principais verificados"

      - name: Verificar documentacao
        run: |
          test -s README.md
          test -s 04_Implantacao_PortfolioHUB/Plano_de_Implantacao.md
          test -s 04_Implantacao_PortfolioHUB/Arquitetura_Integracao_Gemini.md
          test -s 04_Implantacao_PortfolioHUB/Relatorio_de_Testes.md
          echo "Documentacao verificada"
